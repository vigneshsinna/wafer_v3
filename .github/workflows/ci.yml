name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, gd, zip, intl, bcmath, sqlite3, pdo_sqlite
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      # Database-backed feature tests need a sanitized base schema and seed fixture.
      - run: php artisan test --testsuite=Unit
      - run: php artisan test tests/Feature/ReleaseRouteSafetyTest.php

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
